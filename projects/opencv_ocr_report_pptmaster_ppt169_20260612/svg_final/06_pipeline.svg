<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#FAFBFC" /><rect x="0" y="0" width="12" height="720" fill="#1565C0" /></g>
  <g id="header"><text x="56" y="42" font-family="Consolas, Courier New, monospace" font-size="12" fill="#566273">PROCESS PIPELINE</text><text x="1224" y="42" font-family="Consolas, Courier New, monospace" font-size="12" fill="#566273" text-anchor="end">06 / 15</text></g>
  <g id="title"><text x="56" y="92" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2933">处理流程：从攻略截图到结构化 CSV，关键是逐步缩小 OCR 的问题规模</text></g>
  <g id="pipeline">
    <path fill="#FFFFFF" stroke="#CBD5E1" d="M62,160 H1218 A6,6 0 0 1 1224,166 V364 A6,6 0 0 1 1218,370 H62 A6,6 0 0 1 56,364 V166 A6,6 0 0 1 62,160 Z" />
    <path fill="#EEF3F8" stroke="#CBD5E1" d="M88,214 H204 A6,6 0 0 1 210,220 V300 A6,6 0 0 1 204,306 H88 A6,6 0 0 1 82,300 V220 A6,6 0 0 1 88,214 Z" />
    <text x="146" y="244" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933" text-anchor="middle">原始截图</text>
    <text x="146" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#566273" text-anchor="middle">复杂背景输入</text>
    <polygon points="228,260 256,246 256,274" fill="#1565C0" />
    <path fill="#EEF3F8" stroke="#CBD5E1" d="M282,214 H398 A6,6 0 0 1 404,220 V300 A6,6 0 0 1 398,306 H282 A6,6 0 0 1 276,300 V220 A6,6 0 0 1 282,214 Z" />
    <text x="340" y="244" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933" text-anchor="middle">预处理</text>
    <text x="340" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#566273" text-anchor="middle">降噪与二值化</text>
    <polygon points="422,260 450,246 450,274" fill="#1565C0" />
    <path fill="#EEF3F8" stroke="#CBD5E1" d="M476,214 H592 A6,6 0 0 1 598,220 V300 A6,6 0 0 1 592,306 H476 A6,6 0 0 1 470,300 V220 A6,6 0 0 1 476,214 Z" />
    <text x="534" y="244" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933" text-anchor="middle">区域定位</text>
    <text x="534" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#566273" text-anchor="middle">找到表格主体</text>
    <polygon points="616,260 644,246 644,274" fill="#1565C0" />
    <path fill="#1565C0" stroke="#1565C0" d="M670,214 H786 A6,6 0 0 1 792,220 V300 A6,6 0 0 1 786,306 H670 A6,6 0 0 1 664,300 V220 A6,6 0 0 1 670,214 Z" />
    <text x="728" y="244" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">网格恢复</text>
    <text x="728" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">行列与边界</text>
    <polygon points="810,260 838,246 838,274" fill="#1565C0" />
    <path fill="#EEF3F8" stroke="#CBD5E1" d="M864,214 H980 A6,6 0 0 1 986,220 V300 A6,6 0 0 1 980,306 H864 A6,6 0 0 1 858,300 V220 A6,6 0 0 1 864,214 Z" />
    <text x="922" y="244" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933" text-anchor="middle">单元格 OCR</text>
    <text x="922" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#566273" text-anchor="middle">局部文字读取</text>
    <polygon points="1004,260 1032,246 1032,274" fill="#1565C0" />
    <path fill="#EEF3F8" stroke="#CBD5E1" d="M1058,214 H1174 A6,6 0 0 1 1180,220 V300 A6,6 0 0 1 1174,306 H1058 A6,6 0 0 1 1052,300 V220 A6,6 0 0 1 1058,214 Z" />
    <text x="1116" y="244" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933" text-anchor="middle">结构化输出</text>
    <text x="1116" y="274" font-family="Consolas, Courier New, monospace" font-size="14" fill="#566273" text-anchor="middle">CSV / script</text>
  </g>
  <g id="explanations">
    <path fill="#FFFFFF" stroke="#CBD5E1" d="M62,408 H410 A6,6 0 0 1 416,414 V562 A6,6 0 0 1 410,568 H62 A6,6 0 0 1 56,562 V414 A6,6 0 0 1 62,408 Z" />
    <text x="82" y="444" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#1565C0">为什么不是整图 OCR</text>
    <text font-size="16" font-family="Microsoft YaHei, Arial, sans-serif" fill="#1F2933" x="82" y="478">整图 OCR 得到的是无序文本流，无法稳定恢复表格行列关系，</text><text font-size="16" font-family="Microsoft YaHei, Arial, sans-serif" fill="#1F2933" x="82" y="503">动作顺序也容易混乱。</text><path fill="#FFFFFF" stroke="#CBD5E1" d="M466,408 H814 A6,6 0 0 1 820,414 V562 A6,6 0 0 1 814,568 H466 A6,6 0 0 1 460,562 V414 A6,6 0 0 1 466,408 Z" />
    <text x="486" y="444" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F766E">结构恢复的作用</text>
    <text font-size="16" font-family="Microsoft YaHei, Arial, sans-serif" fill="#1F2933" x="486" y="478">用横线、竖线和交点先确定单元格边界，OCR 只负责读更小、</text><text font-size="16" font-family="Microsoft YaHei, Arial, sans-serif" fill="#1F2933" x="486" y="503">更干净的局部图像。</text><path fill="#FFFFFF" stroke="#CBD5E1" d="M870,408 H1218 A6,6 0 0 1 1224,414 V562 A6,6 0 0 1 1218,568 H870 A6,6 0 0 1 864,562 V414 A6,6 0 0 1 870,408 Z" />
    <text x="890" y="444" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#F59E0B">后处理的必要性</text>
    <text font-size="16" font-family="Microsoft YaHei, Arial, sans-serif" fill="#1F2933" x="890" y="478">OCR 文本还要统一回合格式、动作符号和说明字段，才能真正</text><text font-size="16" font-family="Microsoft YaHei, Arial, sans-serif" fill="#1F2933" x="890" y="503">进入自动化执行链路。</text></g>
  <g id="footer"><rect x="56" y="660" width="1168" height="1" fill="#CBD5E1" /><text x="56" y="682" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8A94A6">Source: report_draft_revised.docx</text></g>
</svg>