<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="720" fill="#1565C0"/></g>
  <g id="header"><text x="56" y="42" font-family="Consolas, Courier New, monospace" font-size="12" fill="#566273">KEY TECHNIQUE 03</text><text x="1224" y="42" font-family="Consolas, Courier New, monospace" font-size="12" fill="#566273" text-anchor="end">09 / 15</text></g>
  <g id="title"><text x="56" y="92" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2933">单元格 OCR 与复杂动作解析：识别文本之后还要恢复动作语义</text></g>
  <g id="examples">
    <rect x="56" y="146" width="1168" height="114" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="82" y="184" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#1565C0">复杂动作格示例</text>
    <rect x="322" y="174" width="120" height="48" rx="4" fill="#EEF3F8" stroke="#CBD5E1"/><text x="382" y="205" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#1F2933" text-anchor="middle">3↑</text>
    <rect x="470" y="174" width="120" height="48" rx="4" fill="#EEF3F8" stroke="#CBD5E1"/><text x="530" y="205" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#1F2933" text-anchor="middle">5A</text>
    <rect x="618" y="174" width="120" height="48" rx="4" fill="#1565C0"/><text x="678" y="205" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3A/4A</text>
    <rect x="766" y="174" width="148" height="48" rx="4" fill="#EEF3F8" stroke="#CBD5E1"/><text x="840" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2933" text-anchor="middle">多行动作</text>
    <rect x="942" y="174" width="148" height="48" rx="4" fill="#EEF3F8" stroke="#CBD5E1"/><text x="1016" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2933" text-anchor="middle">条件说明</text>
  </g>
  <g id="strategy">
    <rect x="56" y="300" width="360" height="230" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="82" y="338" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700" fill="#1565C0">01</text>
    <text x="82" y="372" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933">子行切分</text>
    <text x="82" y="410" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933"><tspan x="82" dy="0">复杂格不直接整体识别，先在单元格内部判断是否存在多行内容，</tspan><tspan x="82" dy="25">把 OCR 输入进一步拆小。</tspan></text>
    <rect x="460" y="300" width="360" height="230" rx="6" fill="#1565C0"/>
    <text x="486" y="338" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700" fill="#FFFFFF">02</text>
    <text x="486" y="372" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">动作符号解析</text>
    <text x="486" y="410" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#FFFFFF"><tspan x="486" dy="0">结合业务规则识别数字、方向箭头、攻击符号和组合动作，尽量</tspan><tspan x="486" dy="25">恢复原始动作顺序。</tspan></text>
    <rect x="864" y="300" width="360" height="230" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="890" y="338" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700" fill="#1565C0">03</text>
    <text x="890" y="372" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933">低置信保留</text>
    <text x="890" y="410" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933"><tspan x="890" dy="0">遇到无法完全判断的片段时保留原始识别痕迹和调试信息，避免</tspan><tspan x="890" dy="25">后处理过度修正。</tspan></text>
  </g>
  <g id="bottom"><rect x="56" y="568" width="1168" height="60" rx="6" fill="#F6F8FB" stroke="#CBD5E1"/><text x="80" y="604" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2933">这一阶段把系统从“能读出表格文字”推进到“能理解攻略动作表达”，也是自动化执行能否衔接的关键。</text></g>
  <g id="footer"><rect x="56" y="660" width="1168" height="1" fill="#CBD5E1"/><text x="56" y="682" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8A94A6">Source: report_draft_revised.docx</text></g>
</svg>
