<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#FAFBFC"/><rect x="0" y="0" width="12" height="720" fill="#1565C0"/></g>
  <g id="header"><text x="56" y="42" font-family="Consolas, Courier New, monospace" font-size="12" fill="#566273">CURRENT CAPABILITIES</text><text x="1224" y="42" font-family="Consolas, Courier New, monospace" font-size="12" fill="#566273" text-anchor="end">13 / 15</text></g>
  <g id="title"><text x="56" y="92" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2933">当前方案特点：面向固定结构攻略表格，形成本地识别闭环</text></g>
  <g id="matrix">
    <rect x="56" y="150" width="548" height="132" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="82" y="188" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700" fill="#1565C0">01</text><text x="82" y="222" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933">专用场景</text><text x="82" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">针对游戏攻略回合行动表，不追求任意文档 OCR 的通用性。</text>
    <rect x="676" y="150" width="548" height="132" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="702" y="188" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700" fill="#1565C0">02</text><text x="702" y="222" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933">成本可控</text><text x="702" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">主要在本地完成识别，减少高频云端 API 调用。</text>
    <rect x="56" y="314" width="548" height="132" rx="6" fill="#1565C0"/>
    <text x="82" y="352" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700" fill="#FFFFFF">03</text><text x="82" y="386" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">链路完整</text><text x="82" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">覆盖预处理、定位、网格恢复、OCR 与后处理，能形成闭环。</text>
    <rect x="676" y="314" width="548" height="132" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="702" y="352" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700" fill="#1565C0">04</text><text x="702" y="386" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933">可调试</text><text x="702" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">中间过程图可以帮助定位问题发生在哪个阶段。</text>
    <rect x="56" y="478" width="548" height="132" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="82" y="516" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700" fill="#1565C0">05</text><text x="82" y="550" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933">可迭代</text><text x="82" y="584" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">新截图类型出现后，可针对具体环节增量优化。</text>
    <rect x="676" y="478" width="548" height="132" rx="6" fill="#EEF3F8" stroke="#CBD5E1"/>
    <text x="702" y="516" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F766E">归纳</text><text x="702" y="550" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933"><tspan x="702" dy="0">方案价值不在于一次覆盖所有图片，而在于把问题拆成可观察、</tspan><tspan x="702" dy="25">可定位、可持续改进的处理链路。</tspan></text>
  </g>
  <g id="footer"><rect x="56" y="660" width="1168" height="1" fill="#CBD5E1"/><text x="56" y="682" font-family="Consolas, Courier New, monospace" font-size="11" fill="#8A94A6">Source: report_draft_revised.docx</text></g>
</svg>
